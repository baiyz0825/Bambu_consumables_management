[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-merger"
version = "0.1.0"
description = "拓竹 A1 自动换盘：多盘 3MF 合盘、换盘码注入与元数据重写"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plate-merger = "plate_merger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plate_merger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
